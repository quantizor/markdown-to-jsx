name: test

on:
  push:
    branches:
      - "main"
  pull_request_target:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Build browser harness bundle
        run: bun run --filter @markdown-to-jsx/browser build

      - name: Install Chromium for Playwright
        working-directory: browser
        run: bunx playwright install --with-deps chromium

      - name: Browser harness smoke tests
        run: bun run test:browser:built

      - name: Native harness smoke tests
        run: bun run test:native:built

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-artifacts
          path: |
            browser/test-results/
            browser/playwright-report/
