[install]
minimumReleaseAge = 259200                      # 3d
minimumReleaseAgeExcludes = ["markdown-to-jsx"]

[test]
preload = ["./lib/src/__mocks__/react-native.ts"]
# The browser and native workspaces carry their own runners (Playwright, jest).
# Prune them from bun test discovery by config so a stray *.spec.ts there can
# never be collected by the root suite.
pathIgnorePatterns = ["native/**", "browser/**"]
